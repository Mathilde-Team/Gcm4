[project]
name = "gnome-connection-manager"
version = "4.0.0"
description = "Simple tabbed SSH/Telnet/RDP/VNC/SPICE/Serial connection manager for GTK3"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<4"
authors = [
    { name = "MathildeDec", email = "mathilde.deuscher@gmail.com" },
]
dependencies = ["loguru (>=0.7.3,<0.8.0)"]

# Commande de la base GTK4 (#133, décision D2 de #118). L'application GTK3
# reste lancée par gnome_connection_manager.py jusqu'à la bascule (D5).
[project.scripts]
gcm4 = "gcm4.app:main"


[project.urls]
Homepage = "https://github.com/MathildeDec/gnome-connection-manager"
Repository = "https://github.com/MathildeDec/gnome-connection-manager"
Changelog = "https://github.com/MathildeDec/gnome-connection-manager/blob/main/CHANGELOG.md"

# NOTE — GTK3/VTE (PyGObject, `import gi` + `gi.repository.{Gtk,Vte,Gdk,...}`)
# ne figurent pas ci-dessous : ces bindings doivent correspondre aux typelibs
# système (gir1.2-gtk-3.0, gir1.2-vte-2.91…) installés via le gestionnaire de
# paquets de la distribution (voir Makefile : python3-gi, gir1.2-vte-2.91).
# Un `pip install PyGObject` isolé ne fournit pas ces typelibs et peut échouer
# sans les en-têtes système (libgirepository-dev, libcairo-dev…) ; ce n'est
# donc pas déclaré comme dépendance Poetry.
#
# Fonctionnalités optionnelles — l'absence d'un extra n'empêche pas le
# démarrage de l'app : le chargeur de plugins (plugin_base.PluginRegistry)
# capture les erreurs d'import et désactive juste le plugin concerné
# (message "n outil(s)/plugin(s) n'ont pas pu se charger" au démarrage) :
#   - netmiko    : push de config en masse (netmiko_bulk_core.py, plugin_netmiko_push.py)
#   - paramiko   : SPICE via libvirt, dépôt SFTP du push SNMP/inventaire
#                  (plugin_spice.py, snmp_bulk_core.py, hypervisor_import_common.py,
#                  tools/*.py), plugin sftp de gcm4 (plugins/sftp/, #75)
#   - libvirt    : import de VM SPICE via libvirt-python (plugin_spice.py)
#   - vnc        : plugin_vnc.py (import top-level de Cryptodome pour
#                  l'authentification VNC/DES) — nécessite en plus le
#                  typelib système GtkVnc/GVnc (gir1.2-gtkvnc-2.0, non pip)
#                  NB : pycryptodomex (et non pycryptodome) est utilisé car
#                  seul ce paquet garantit la fourniture du namespace
#                  `Cryptodome` importé par le code (pycryptodome n'installe
#                  parfois que le namespace legacy `Crypto`).
#
# NOTE — plugin_rdp.py (GtkFrdp.Display) n'a pas d'extra correspondant : le
# namespace GObject Introspection "GtkFrdp" provient du sous-projet local
# gtk-frdp/ (à compiler via meson et installer au niveau système), ce n'est
# pas un paquet PyPI.
[project.optional-dependencies]
netmiko = ["netmiko>=4.2.0"]
paramiko = ["paramiko>=3.4.0"]
libvirt = ["libvirt-python>=9.0.0"]
vnc = ["pycryptodomex>=3.20.0"]

# ─── Construction (hatchling, #133) ─────────────────────────────────────────
# Le projet est empaqueté depuis la base GTK4 : `uv sync` installe `gcm4`
# en mode éditable (commande `gcm4`, version lue par importlib.metadata).
# Le wheel contient src/gcm4 et les modules sans GTK que gcm4 réutilise
# encore depuis la racine (ils migreront dans src/gcm4/core au fil des lots,
# #119). Les .deb/.rpm restent construits par le Makefile.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/gcm4", "gcm4_core.py", "logging_config.py", "master_password_core.py", "pyAES.py"]
sources = ["src"]
# Mode éditable (`uv sync`) : src/ et la racine sur sys.path, sans copie
# des modules racine (une copie figée masquerait les modifications).
dev-mode-dirs = ["src", "."]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11",
    "pyyaml>=6.0",
    # Serveurs SFTP locaux des tests (#74, #75).
    "paramiko>=3.4.0",
]

# ─── import-linter (issue #174) ─────────────────────────────────────────────
# Contrats du futur paquet src/gcm4 (épopée GTK4). Le job Qualité lance
# `lint-imports` dès que src/gcm4 existe ; d'ici là, l'ancien code est
# couvert par tests/test_architecture_imports.py et
# tools/check_circular_imports.py.
[tool.importlinter]
root_packages = ["gcm4"]
include_external_packages = true
# Imports sous `if TYPE_CHECKING:` ignorés (annotations seules, jamais
# exécutés) : le contrat plugin (gcm4.core.plugins, #149) annote Gtk.Widget
# sans charger GTK ; test_gcm4_plugins vérifie que gi reste absent.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Couches : l'interface dépend du cœur, jamais l'inverse"
type = "layers"
layers = ["gcm4.ui", "gcm4.core"]

[[tool.importlinter.contracts]]
name = "Le cœur n'importe ni GTK (gi) ni l'interface"
type = "forbidden"
source_modules = ["gcm4.core"]
forbidden_modules = ["gi", "gcm4.ui"]

# ─── mypy (issue #173) ──────────────────────────────────────────────────────
# Référence progressive : `files` liste les modules vérifiés, sans GTK
# d'abord. Ils sont tous à 0 erreur et le job « Types (mypy) » est
# bloquant ; la liste ne peut que s'allonger (tests/test_mypy_config.py).
# Modules GTK : PyGObject n'a pas de types (pygobject-stubs, évalué dans
# docs/typage.md) ; ils entreront dans la liste avec la base GTK4.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = [
    # Paquet GTK4 (#133) : tout sauf ui/ (PyGObject sans types, cf. plus haut).
    "src/gcm4/__init__.py",
    "src/gcm4/__main__.py",
    "src/gcm4/app.py",
    "src/gcm4/core/__init__.py",
    "src/gcm4/core/chemins.py",
    "src/gcm4/core/host_tree.py",
    "src/gcm4/core/replies.py",
    "src/gcm4/core/chiffrement.py",
    "src/gcm4/core/comportement_onglets.py",
    "src/gcm4/core/deplacements.py",
    "src/gcm4/core/echange_cli.py",
    "src/gcm4/core/edition_lot.py",
    "src/gcm4/core/exchange.py",
    "src/gcm4/core/sauvegarde.py",
    "src/gcm4/core/cli.py",
    "src/gcm4/core/config.py",
    "src/gcm4/core/i18n.py",
    "src/gcm4/core/menu.py",
    "src/gcm4/core/menu_arbre.py",
    "src/gcm4/core/mises_a_jour.py",
    "src/gcm4/core/model.py",
    "src/gcm4/core/onglets.py",
    "src/gcm4/core/plugins.py",
    "src/gcm4/core/preferences.py",
    "src/gcm4/core/raccourcis.py",
    "src/gcm4/core/registre.py",
    "src/gcm4/core/terminal.py",
    "src/gcm4/core/theme.py",
    "src/gcm4/core/validation.py",
    "src/gcm4/core/window_state.py",
    "gcm4_core.py",
    "logging_config.py",
    "models.py",
    "master_password_core.py",
    "folder_context_menu_core.py",
    "gesture_trigger_core.py",
    "inline_editor_core.py",
    "netmiko_bulk_core.py",
    "popup_menu_core.py",
    "putty_import_core.py",
    "snmp_bulk_core.py",
    "tab_context_menu_core.py",
    "plugins/plugin_base.py",
    "plugins/ssh/core.py",
    "plugins/sftp/core.py",
    "plugins/telnet/core.py",
]
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
# Cible Python 3.10+
target-version = "py310"
line-length = 99

exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
    "dist",
    "build",
    "fork",
    # Environnement virtuel uv/venv (session-36, 2026-09-16) : un exclude
    # personnalisé remplace entièrement la liste par défaut de ruff (qui
    # exclut .venv nativement) au lieu de l'étendre — sans cette entrée,
    # `ruff check .`/`ruff format --check .` scannent aussi les paquets
    # tiers installés dans .venv/ (des milliers de faux positifs, constaté
    # à l'ouverture de ce point : 21419 erreurs de lint et 1122 fichiers de
    # mise en forme en trop, tous dans .venv/). Bug latent depuis l'origine
    # de ce fichier, jamais manifesté avant cette session faute de .venv
    # présent au moment des vérifications précédentes.
    ".venv",
    # Répertoires vendorisés (docs/architecture.md §1/§2.5/§8) : code source
    # tiers gardé pour référence/compilation, pas du code GCM à faire évoluer
    # ni à corriger stylistiquement ici (session-35, 2026-09-14 — ces deux
    # répertoires n'étaient pas exclus et gonflaient artificiellement le
    # compte d'erreurs `make lint` de 194 (SSH-Studio) + 2 (gtk-frdp) lignes
    # qui ne concernaient pas le dépôt GCM lui-même).
    "SSH-Studio",
    "gtk-frdp",
]

[tool.ruff.lint]
# E/W  : pycodestyle  (style PEP 8)
# F    : pyflakes     (erreurs logiques)
# I    : isort        (ordre des imports)
# D    : pydocstyle   (docstrings — style Google via convention = "google")
# UP   : pyupgrade    (syntaxe Python moderne)
# B    : flake8-bugbear (pièges courants)
# C4   : flake8-comprehensions
# SIM  : flake8-simplify
select = ["E", "W", "F", "I", "D", "UP", "B", "C4", "SIM"]

ignore = [
    # D2xx — flexibilité sur la mise en forme
    "D200", "D202", "D205", "D212",
    # E501 géré par line-length
    "E501",
    # B006 — listes mutables comme valeur par défaut (héritage upstream)
    "B006",
    # W291/W293 — espaces en fin de ligne (géré par trailing-whitespace pre-commit)

    # SIM117 — nested with (Python < 3.10 compat)
    "SIM117",
    # UP007 — X | Y union types (garder Optional[] pour compat)
    "UP007",
    # D415 — première ligne de docstring sans ponctuation finale (style existant)
    "D415",
    # C408 — dict() au lieu de {} (lisibilité intentionnelle avec kwargs nommés)
    "C408",
    # SIM105 — contextlib.suppress (optionnel, trop verbeux pour du code existant)
    "SIM105",
    # ── Violations héritage gnome_connection_manager.py (code upstream) ──────
    # UP031 — printf-style % formatting (massivement utilisé dans l'original)
    "UP031",
    # E711 — comparaisons avec None/True/False (style upstream)
    "E711",
    # E721 — comparaison de type avec == (style upstream)
    "E721",
    # E722 — bare except (nombreux dans l'upstream)
    "E722",
    # SIM115 — open() sans context manager (code héritage)
    "SIM115",
    # SIM102 — if imbriqués collapsibles (lisibilité préférable)
    "SIM102",
    # SIM101 — isinstance() dupliqué
    "SIM101",
    # SIM108 — ternaire
    "SIM108",
    # B015 — comparaison inutile
    "B015",
    # B023 — variable de boucle dans lambda/closure (upstream)
    "B023",
    # F821 — undefined-name (noms GTK/GLib résolus à l'exécution, pas statiquement)
    "F821",
    # E402 — imports non en tête de fichier (guards try/except pour GTK)
    "E402",
    # F841 — variables locales non utilisées (upstream)
    "F841",
]

# Style de docstrings : Google
[tool.ruff.lint.pydocstyle]
convention = "google"

# isort : compatibilité black
[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["gnome_connection_manager", "gcm4_core"]

[tool.ruff.lint.per-file-ignores]
"urlregex.py" = ["W605"]

[tool.ruff.format]
# Formatage compatible black
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ─── Black ───────────────────────────────────────────────────────────────────
[tool.black]
line-length = 99
target-version = ["py310", "py311", "py312", "py313"]

# ─── Pytest ──────────────────────────────────────────────────────────────────
# ─── Couverture (issue #128, parité Netcross #224/#246) ─────────────────────
[tool.coverage.run]
# Code de l'application uniquement : ni les tests, ni les sous-projets
# vendorisés (SSH-Studio/, gtk-frdp/), ni les outils annexes (tools/,
# scripts/). source = ["."] compte aussi, à 0 %, les modules qu'aucun test
# n'importe : la mesure ne flatte pas la couverture réelle.
source = [".", "src/gcm4"]
branch = true
# Chemins relatifs à la racine du dépôt (#163) : les données du job Qualité
# (runner « maison ») et du job GTK4 (conteneur, autre chemin de checkout)
# se fusionnent par `coverage combine`.
relative_files = true
omit = [
    "tests/*",
    "SSH-Studio/*",
    "gtk-frdp/*",
    "tools/*",
    "scripts/*",
    ".venv/*",
    "rdp/*",
    "vnc/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
# Seuil bloquant : voir docs/quality/seuil-couverture.md. Appliqué au total
# COMBINÉ Qualité + GTK4 (job « Couverture combinée », requis sur dev,
# issue #278) ; le job Qualité seul passe --cov-fail-under=0. Palier 1 de
# #293 : mesure combinée de dev au 22/10/2026 (41,7 %) arrondie à l'entier
# inférieur. Palier 2 de #293 (24/10/2026) : 43,9 % sur dev + tests de
# plugin_base et hypervisor_import_common (≈ 45,3 %), soit 45. Palier 3 de
# #293 (26/10/2026) : 50,9 % sur dev + tests de netmiko_bulk_core, soit 50.
# Palier 4 de #293 (30/10/2026) : 51,4 % sur dev + tests de
# src/gcm4/ui/fichiers.py, dialogues.py, mises_a_jour.py et __main__.py,
# soit 51.
# Relever ce chiffre quand la base monte, ne jamais le baisser
# pour faire passer une PR. Cible de l'équipe : 95 % (Mathilde-Team/.github#9).
fail_under = 51
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Issue #160 : marqueurs de dépendance externe (voir tests/conftest.py) ;
# --strict-markers refuse un marqueur mal orthographié, qui ne serait
# jamais vérifié.
addopts = ["--strict-markers"]
markers = [
    "requires_gettext: a besoin de msgfmt ; échoue au lieu d'être sauté si GCM_TESTS_EXIGES contient gettext",
    "requires_gtk4: a besoin de GTK4/libadwaita et d'un écran ; échoue au lieu d'être sauté si GCM_TESTS_EXIGES contient gtk4",
]
