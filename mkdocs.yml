# mkdocs.yml -- documentation navigable de Gcm4 (règle commune à tous les
# dépôts de Mathilde-Team, modèle Netcross #282 / IAO #183).
#
# La doc existante est déjà en Markdown : aucun fichier n'est copié.
# README.md, Documentation-fr.md et CHANGELOG.md (racine du dépôt) sont
# inclus par pymdownx.snippets depuis des pages de docs/.
#
# En local : uv run --with "mkdocs<2" --with mkdocs-material mkdocs serve
# En CI : mkdocs build --strict (bloque sur lien mort). Pas de site_url :
# la documentation n'est pas publiée (pas de GitHub Pages).

site_name: Gcm4
site_description: >-
  Gestionnaire de connexions multi-protocoles pour GNOME (SSH, RDP, VNC,
  SPICE, série, telnet, BMC), en cours de migration vers GTK4.
repo_url: https://github.com/Mathilde-Team/Gcm4
repo_name: Mathilde-Team/Gcm4
docs_dir: docs
exclude_docs: |
  sessions/

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Mode clair

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Accueil: index.md
  - Guide utilisateur:
      - "gcm4 (GTK4) : installation et premiers pas": guide/base-gtk4.md
      - "gcm4 : navigateur de fichiers SFTP": guide/sftp.md
      - "gcm4 : mot de passe maître": guide/mot-de-passe-maitre.md
      - Documentation utilisateur: guide/utilisateur.md
      - Fichier de configuration: configuration.md
      - Import et export des hôtes: echange-hotes.md
      - Langue de l'interface: i18n.md
      - Journaux et mode debug: journalisation.md
  - Développement:
      - Architecture: architecture.md
      - Diagramme de classes: class-diagram.md
      - Écrire un plugin: plugins.md
      - Migration GTK4: gtk4-migration.md
      - Portage des plugins GTK4: gtk4-plugins-portage.md
      - Renommage GCM vers gcm4: gcm4-rename.md
      - Typage statique: typage.md
      - Seuil de couverture: quality/seuil-couverture.md
      - Publication: release.md
  - Suivi:
      - Roadmap: roadmap.md
      - Backlog des fonctionnalités: features-backlog.md
      - Historique des modifications: guide/changements.md
