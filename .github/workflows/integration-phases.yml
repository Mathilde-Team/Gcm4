name: Suivi des phases d'intégration

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: read
  contents: read

jobs:
  rapport-phases:
    name: Rapport d'avancement par phase
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les fichiers de suivi
        run: |
          echo "## Vérification des fichiers de suivi" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in docs/roadmap.md docs/features-backlog.md; do
            if [ -f "$f" ]; then
              echo "✅ \`$f\` présent" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ \`$f\` manquant" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Générer le rapport d'avancement
        uses: actions/github-script@v7
        with:
          script: |
            // #107 : toutes les pages (github.paginate, pas seulement les 100
            // premiers résultats) et sans les PR, que l'API issues renvoie aussi.
            const depot = { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 };
            const sansPR = (liste) => liste.filter(i => !i.pull_request);
            const openIssues = sansPR(await github.paginate(github.rest.issues.listForRepo, { ...depot, state: 'open' }));
            const closedIssues = sansPR(await github.paginate(github.rest.issues.listForRepo, { ...depot, state: 'closed' }));

            let prs = [];
            try {
              prs = await github.paginate(github.rest.pulls.list, { ...depot, state: 'open' });
            } catch (e) {
              core.warning(`Liste des PR ouvertes indisponible : ${e.message}`);
            }

            // Libellés réellement définis dans le dépôt (#107).
            const familles = [
              ['Priorité', ['P0-critique', 'P1-haute', 'P2-moyenne', 'P3-faible', 'P4-bloquée']],
              ['Importance', ['haute', 'moyenne', 'faible']],
              ['Dépôt suivi', ['track-gcm4', 'track-vnc', 'track-rdp']],
              ['État', ['bloqué', 'décision-produit', 'question', 'HUMAIN']],
            ];
            const aLabel = (issue, nom) => issue.labels.some(l => (typeof l === 'string' ? l : l.name) === nom);
            const compter = (nom) => openIssues.filter(i => aLabel(i, nom)).length;
            const priorites = familles[0][1];
            const noPriority = openIssues.filter(i => !priorites.some(p => aLabel(i, p)));

            const lines = [];
            lines.push(`## Rapport d'avancement — ${context.repo.owner}/${context.repo.repo}`);
            lines.push('');
            lines.push(`**Date** : ${new Date().toISOString()}`);
            lines.push(`**Déclencheur** : ${context.eventName}`);
            lines.push('');
            lines.push('### Vue d\'ensemble');
            lines.push('');
            lines.push('| Métrique | Valeur |');
            lines.push('|----------|--------|');
            lines.push(`| Issues ouvertes | ${openIssues.length} |`);
            lines.push(`| Issues closes | ${closedIssues.length} |`);
            lines.push(`| PRs ouvertes | ${prs.length} |`);
            lines.push('');

            for (const [titre, noms] of familles) {
              const actifs = noms.filter(n => compter(n) > 0);
              if (actifs.length === 0) continue;
              lines.push(`### Issues ouvertes — ${titre}`);
              lines.push('');
              lines.push(`| ${titre} | Nombre |`);
              lines.push('|----------|--------|');
              for (const n of actifs) {
                lines.push(`| ${n} | ${compter(n)} |`);
              }
              if (titre === 'Priorité') {
                lines.push(`| Sans priorité | ${noPriority.length} |`);
              }
              lines.push('');
            }

            if (noPriority.length > 0) {
              lines.push('### Issues sans priorité');
              lines.push('');
              for (const i of noPriority) {
                lines.push(`- #${i.number}: ${i.title}`);
              }
              lines.push('');
            }

            if (prs.length > 0) {
              lines.push('### PRs ouvertes');
              lines.push('');
              for (const p of prs) {
                lines.push(`- #${p.number}: ${p.title} (${p.head.ref})`);
              }
              lines.push('');
            }

            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
