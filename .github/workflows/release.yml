# Construction et publication des paquets .deb et .rpm (issue #162).
#
# Sur tag v* (ex. v4.0.0) : construit les paquets avec les cibles du Makefile
# (make deb : paquet gcm4, build-deb/build.sh, #156 ; make rpm et
# make opensuse : fpm), vérifie leur contenu, les
# publie en artefact et les attache à la release GitHub du tag.
# workflow_dispatch : même construction sans tag (artefacts seulement), pour
# tester un build ; version optionnelle, sinon PKG_VERSION du Makefile.
#
# Runner GitHub (ubuntu-latest), comme le workflow Release de Netcross :
# environnement propre avec sudo, ruby et rpmbuild installables.
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (ex. 1.3.4) ; vide = PKG_VERSION du Makefile"
        required: false
        type: string

permissions:
  contents: write  # attacher les paquets à la release du tag

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paquets:
    name: Paquets (.deb, .rpm, openSUSE)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # changelog des paquets : git log

      - name: Outils de construction (gettext, rpm, fpm)
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq gettext rpm ruby ruby-dev build-essential \
            debhelper dh-python dpkg-dev python3-build python3-hatchling python3-pip
          # Ubuntu 24.04 (ubuntu-latest) fournit hatchling 1.21, pyproject.toml
          # exige >= 1.24 et build-deb/build.sh construit sans isolation (#362).
          # --ignore-installed : packaging de Debian ne se désinstalle pas avec pip.
          sudo -n python3 -m pip install --quiet --break-system-packages --ignore-installed "hatchling>=1.24"
          sudo gem install --no-document fpm

      - name: Version
        id: version
        env:
          SAISIE: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$SAISIE" ]; then
            VERSION="$SAISIE"
          else
            VERSION="$(sed -n 's/^PKG_VERSION *= *//p' Makefile)"
          fi
          # Pré-version (tag v1.3.4-rc1) : « - » devient « ~ » (1.3.4~rc1),
          # que dpkg et rpm trient AVANT 1.3.4. Un « - » serait lu comme
          # révision Debian et refusé dans la version rpm.
          VERSION="${VERSION//-/\~}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version construite : $VERSION"

      - name: Paquet .deb (gcm4)
        # Paquet gcm4 de la base GTK4 (build-deb/build.sh, #156) : plus de .deb
        # de l'application GTK3. Sa version est celle de pyproject.toml, seule
        # source (build-deb/build.sh), pas celle du tag.
        run: |
          make deb
          cp build-deb/dist/gcm4_*_all.deb .

      - name: Paquet .rpm (Fedora, RHEL)
        run: make rpm PKG_VERSION=${{ steps.version.outputs.version }}

      - name: Paquet .rpm (openSUSE)
        run: make opensuse PKG_VERSION=${{ steps.version.outputs.version }}

      - name: Vérification du contenu
        # Mêmes garanties que tests/test_paquet_contenu.py, sur les paquets
        # réellement produits : modules du cœur et plugins présents.
        # Listes écrites dans des fichiers : avec pipefail (shell par défaut
        # des étapes), `dpkg -c | grep -q` échouerait sur le SIGPIPE.
        run: |
          mkdir -p "$RUNNER_TEMP/rpmdb"
          dpkg -c ./*.deb > "$RUNNER_TEMP/deb.txt"
          for r in ./*.rpm; do rpm -qpl --dbpath "$RUNNER_TEMP/rpmdb" "$r" > "$RUNNER_TEMP/$(basename "$r").txt"; done
          # .deb : paquet gcm4 (le test de fumée complet est le job « Paquets »
          # de ci.yml, scripts/smoke-test-packages.sh).
          for f in /usr/bin/gcm4 /usr/share/gcm4/gcm4/__init__.py /usr/share/gcm4/gcm4_core.py; do
            grep -q "\.$f\$" "$RUNNER_TEMP/deb.txt" || { echo "::error::$f absent du .deb"; exit 1; }
          done
          for f in gcm4_core.py logging_config.py models.py utils.py widgets.py plugins/plugin_base.py plugins/ssh/core.py; do
            for liste in "$RUNNER_TEMP"/*.rpm.txt; do
              grep -q "/usr/share/gnome-connection-manager/$f\$" "$liste" || { echo "::error::$f absent de $(basename "$liste" .txt)"; exit 1; }
            done
          done
          ls -l ./*.deb ./*.rpm | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: paquets-${{ steps.version.outputs.version }}
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

      - name: Attache à la release GitHub (tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            *.deb
            *.rpm
          generate_release_notes: true
          # Tag avec suffixe (v1.3.4-rc1) : publiée comme pré-version.
          prerelease: ${{ contains(github.ref_name, '-') }}
